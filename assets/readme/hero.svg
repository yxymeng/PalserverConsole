  <title id="title">PalServerConsole · 帕鲁海岛管理站</title>
  <desc id="desc">灯塔、帕鲁足迹、配置小屋和备份港湾组成一座海岛，代表服务器管理、只读世界查询、世界法则与维护。功能示意插图，并非游戏地图。</desc>
